name: Update photo list
on:
  push:
    branches: [main]
    paths: ["photos/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 .github/scripts/build_photos.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A photos.json thumbs large
          git diff --cached --quiet || (git commit -m "Update photo list" && git push)
